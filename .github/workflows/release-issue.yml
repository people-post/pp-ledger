name: release-issue

# When a release branch is cut (release/X.Y), open its release issue ("Release pp-ledger 2.0") from
# .github/ISSUE_TEMPLATE/release.md, assigned to whoever pushed the branch, and create the branch's backport label
# (`backport release/2.0`) for the backport bot. docs/ops/RELEASE.md § Release branches and backports.

on: create

permissions:
  contents: read
  issues: write

jobs:
  release-issue:
    # `create` takes no branch filter: the ref is checked here and in the script.
    if: github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: .github/ISSUE_TEMPLATE
          sparse-checkout-cone-mode: false

      - name: Open the release issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.ref }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          if ! [[ "$BRANCH" =~ ^release/([0-9]+\.[0-9]+)$ ]]; then
            echo "::notice::$BRANCH is not release/X.Y; no release issue."
            exit 0
          fi
          version=${BASH_REMATCH[1]}
          title="Release pp-ledger $version"

          # Labels the issue and the backport bot use; an existing one is left as it is.
          gh label create release --color 0e8a16 --description 'A release record (.github/ISSUE_TEMPLATE/release.md)' 2>/dev/null || true
          gh label create "backport $BRANCH" --color c5def5 --description "Backport this merged main PR to $BRANCH" 2>/dev/null || true

          if gh issue list --state all --label release --search "\"$title\" in:title" --json title --jq '.[].title' | grep -qxF "$title"; then
            echo "::notice::\"$title\" exists already."
            exit 0
          fi

          export VERSION=$version
          python3 - >"$RUNNER_TEMP/body.md" <<'PY'
          import os, re
          text = open(".github/ISSUE_TEMPLATE/release.md", encoding="utf-8").read()
          text = re.sub(r"\A---\n.*?\n---\n", "", text, flags=re.S).lstrip()
          text = re.sub(r"\A<!--.*?-->\s*", "", text, flags=re.S)  # the note for filing by hand
          for key, value in (("<branch>", os.environ["BRANCH"]), ("<owner>", os.environ["ACTOR"]),
                             ("X.Y", os.environ["VERSION"])):
              text = text.replace(key, value)
          print(text, end="")
          PY
          make_issue() { # make_issue [assignee]
            jq -n --arg title "$title" --rawfile body "$RUNNER_TEMP/body.md" --arg who "${1:-}" \
              '{title: $title, body: $body, labels: ["release"]} + (if $who == "" then {} else {assignees: [$who]} end)' \
              | gh api "repos/$GH_REPO/issues" --input - --jq '.html_url'
          }
          make_issue "$ACTOR" || make_issue
