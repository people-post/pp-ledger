name: Release Docker image

on:
  push:
    tags:
      - 'release/v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for the image tag (e.g. 1.0.0). Defaults to 0.0.0-dev for manual runs.'
        required: false
        default: '0.0.0-dev'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Derive version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#release/v}"
            VERSION="${VERSION#release/}"
            LATEST=true
          else
            VERSION="${{ inputs.version }}"
            LATEST=false
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.version.outputs.image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ steps.version.outputs.latest == 'true' }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Package linux-x64 binary tarball from image
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          IMAGE="${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}"
          docker pull "$IMAGE"
          STAGE="$(mktemp -d)"
          CID="$(docker create "$IMAGE")"
          docker cp "$CID:/usr/local/bin/." "$STAGE/"
          docker rm "$CID"
          ARCHIVE="pp-ledger-linux-x64-${{ steps.version.outputs.version }}.tar.gz"
          tar -czf "$ARCHIVE" -C "$STAGE" \
            pp-beacon pp-relay pp-miner pp-client pp-http
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          ls -lh "$ARCHIVE"

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
