name: Build pp-ledger

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Include layout
        if: runner.os == 'Linux'
        run: ./scripts/check/check_includes.sh

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Install macOS deps
        if: runner.os == 'macOS'
        run: |
          if ! command -v cmake >/dev/null 2>&1; then
            brew install cmake
          fi
          if ! command -v ninja >/dev/null 2>&1; then
            brew install ninja
          fi

      - name: Install Windows deps
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ninja --no-progress -y

      # ccache (MSVC included): objects whose sources and flags did not change are reused. The
      # key names the commit; any earlier cache of the OS is restored when it is new.
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}
          max-size: 2G

      - name: Configure and build
        shell: bash
        env:
          RUNNER_OS: ${{ runner.os }}
          # Every core the runner has (macOS 3, Linux and Windows 4).
          CMAKE_BUILD_PARALLEL_LEVEL: ${{ runner.os == 'macOS' && 3 || 4 }}
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: ./scripts/ci-build.sh --build --with-tests

      - name: Test
        shell: bash
        env:
          RUNNER_OS: ${{ runner.os }}
        run: ./scripts/ci-build.sh --run-tests
