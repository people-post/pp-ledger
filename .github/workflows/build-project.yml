name: Build pp-ledger

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            experimental: false
          - os: macos-14
            experimental: false
          # POSIX networking (epoll/kqueue); MSVC port not yet landed.
          - os: windows-2022
            experimental: true

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Install macOS deps
        if: runner.os == 'macOS'
        run: |
          if ! command -v cmake >/dev/null 2>&1; then
            brew install cmake
          fi

      - name: Install Windows deps
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ninja --no-progress -y

      - name: Build and test
        shell: bash
        env:
          RUNNER_OS: ${{ runner.os }}
          CMAKE_BUILD_PARALLEL_LEVEL: 2
        run: ./scripts/ci-build.sh --test
