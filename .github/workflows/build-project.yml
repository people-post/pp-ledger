name: Build pp-ledger

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    # Pin to Ubuntu 24.04 so CI matches the Docker runtime base (ubuntu:24.04).
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake
      
      - name: Build and test
        run: ./scripts/ci-build.sh --test
